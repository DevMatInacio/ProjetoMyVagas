<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dashboard - Candidato</title>
<!-- Importação do Bootstrap e ícones -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
    /* Efeito hover nas cards de vaga */
    .card-vaga:hover {
        transform: translateY(-2px);
        transition: transform 0.2s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    /* Estilização personalizada para a navbar do candidato */
    .navbar-candidato {
        background: linear-gradient(135deg, #28a745, #20c997);
    }
</style>
</head>
<body>
    <!-- Navbar específica para candidatos -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-candidato">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-person-circle me-2"></i> Área do Candidato
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    Olá, <strong th:text="${candidato.nome}">Candidato</strong>!
                </span>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Mensagens do sistema -->
        <div th:if="${param.msg}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${param.msg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- Sidebar com informações do perfil -->
            <div class="col-lg-3 mb-4">
                <!-- Card de perfil do candidato -->
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Meu Perfil</h5>
                        <p class="small">
                            <strong>Nome:</strong> <span th:text="${candidato.nome}"></span>
                        </p>
                        <p class="small">
                            <strong>Email:</strong> <span th:text="${candidato.email}"></span>
                        </p>
                        <p class="small">
                            <strong>Currículo:</strong> <span th:text="${candidato.curriculo}"></span>
                        </p>
                    </div>
                </div>

                <!-- Card de estatísticas -->
                <div class="card mt-3">
                    <div class="card-body text-center">
                        <h3 th:text="${#lists.size(minhasCandidaturas)}" class="text-success">0</h3>
                        <p class="mb-0">Minhas Candidaturas</p>
                    </div>
                </div>
            </div>

            <!-- Conteúdo principal -->
            <div class="col-lg-9">
                <!-- Seção de vagas disponíveis -->
                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">
                            <i class="bi bi-briefcase me-2"></i> Vagas Disponíveis
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Mensagem quando não há vagas -->
                        <div th:if="${#lists.isEmpty(vagasDisponiveis)}" class="text-center py-4">
                            <i class="bi bi-inbox display-1 text-muted"></i>
                            <p class="mt-3">Nenhuma vaga disponível no momento.</p>
                        </div>

                        <!-- Loop através das vagas disponíveis -->
                        <div th:each="vaga : ${vagasDisponiveis}" class="card card-vaga mb-3">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-8">
                                        <h5 th:text="${vaga.titulo}" class="card-title">Título da Vaga</h5>
                                        <p class="card-text" th:text="${vaga.empresa.nomeFantasia} + ' • ' + ${vaga.local}"></p>
                                        <p class="card-text text-muted small" 
                                           th:text="${#strings.abbreviate(vaga.descricao, 100)}">
                                            Descrição da vaga
                                        </p>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <!-- Formulário para candidatar-se -->
                                        <form th:action="@{/candidato/candidatar}" method="post" class="d-inline">
                                            <input type="hidden" name="vagaId" th:value="${vaga.id}">
                                            <button type="submit" class="btn btn-success btn-sm">
                                                <i class="bi bi-send-check"></i> Candidatar-se
                                            </button>
                                        </form>
                                        <!-- Link para ver detalhes da vaga -->
                                        <a th:href="@{/vaga/} + ${vaga.id}" 
                                           class="btn btn-outline-primary btn-sm ms-1">
                                            <i class="bi bi-eye"></i> Detalhes
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Seção de candidaturas do usuário -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">
                            <i class="bi bi-list-check me-2"></i> Minhas Candidaturas
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Mensagem quando não há candidaturas -->
                        <div th:if="${#lists.isEmpty(minhasCandidaturas)}" class="text-center py-4">
                            <i class="bi bi-file-earmark-x display-1 text-muted"></i>
                            <p class="mt-3">Você ainda não se candidatou a nenhuma vaga.</p>
                        </div>

                        <!-- Loop através das candidaturas do usuário -->
                        <div th:each="candidatura : ${minhasCandidaturas}" class="border-bottom pb-2 mb-2">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 th:text="${candidatura.vaga.titulo}" class="mb-1">Vaga</h6>
                                    <small class="text-muted" 
                                           th:text="${candidatura.vaga.empresa.nomeFantasia} + ' • ' + ${#temporals.format(candidatura.dataCandidatura, 'dd/MM/yyyy')}"></small>
                                </div>
                                <span class="badge bg-info">Candidatado</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
