<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login - Sistema de Vagas</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
    /* Estilização personalizada para o card de login */
    .login-card {
        max-width: 400px;
        margin: 0 auto;
    }

    .card-header-custom {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
</style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 login-card">
                <div class="card shadow">
                    <!-- Cabeçalho do card de login -->
                    <div class="card-header card-header-custom text-center py-4">
                        <i class="bi bi-person-circle display-4 d-block mb-2"></i>
                        <h2 class="mb-0">Acessar MyVagas</h2>
                    </div>
                    <div class="card-body p-5">

                        <!-- Mensagem de erro de login -->
                        <div th:if="${param.erro}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i> Credenciais inválidas. Tente novamente.
                        </div>

                        <!-- Mensagem de logout bem-sucedido -->
                        <div th:if="${param.logout}" class="alert alert-info">
                            <i class="bi bi-check-circle"></i> Logout realizado com sucesso!
                        </div>

                        <!-- Formulário de login -->
                        <form th:action="@{/login}" method="post">
                            <!-- Campo hidden para redirecionamento após login -->
                            <input type="hidden" name="redirect" th:value="${param.redirect}">

                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" name="email" class="form-control" 
                                           placeholder="seu@email.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="senha" class="form-control" 
                                           placeholder="Sua senha" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right"></i> Entrar
                            </button>
                        </form>
                        
                        <!-- Links para cadastro -->
                        <div class="text-center mt-4">
                            <p class="mb-2">Ainda não tem conta?</p>
                            <div class="d-grid gap-2">
                                <a href="/cadastro?tipo=candidato" class="btn btn-outline-success">
                                    <i class="bi bi-person"></i> Cadastrar como Candidato
                                </a>
                                <a href="/cadastro?tipo=empresa" class="btn btn-outline-primary">
                                    <i class="bi bi-building"></i> Cadastrar como Empresa
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
