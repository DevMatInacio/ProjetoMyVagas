<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cadastro - Sistema de Vagas</title>
<!-- Importação do Bootstrap CSS para estilização -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Importação de ícones do Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
    /* Estilização personalizada para o card de cadastro */
    .cadastro-card {
        max-width: 500px;
        margin: 0 auto;
    }
    
    /* Estilização das abas de navegação */
    .nav-tabs .nav-link.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
    }
    
    .nav-tabs .nav-link {
        color: #667eea;
    }
</style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 cadastro-card">
                <div class="card shadow">
                    <!-- Cabeçalho do card -->
                    <div class="card-header bg-white text-center py-4">
                        <!-- Botão para voltar à página inicial -->
                        <a href="/" class="btn btn-outline-secondary btn-sm mb-3">
                            <i class="bi bi-arrow-left"></i> Voltar para Inicio
                        </a>
                        <h2 class="mb-0">Criar sua conta</h2>
                        <p class="text-muted mb-0">Junte-se a nossa plataforma</p>
                    </div>

                    <div class="card-body p-4">
                        <!-- Seção de mensagens do sistema -->
                        <div th:if="${param.erro}" class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                            <span th:text="${param.erro}"></span>
                        </div>

                        <div th:if="${param.msg}" class="alert alert-success">
                            <i class="bi bi-check-circle"></i>
                            <span th:text="${param.msg}"></span>
                        </div>

                        <!-- Sistema de abas para seleção do tipo de cadastro -->
                        <ul class="nav nav-tabs nav-justified mb-4" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <!-- Aba para cadastro de candidato -->
                                <button class="nav-link active" id="candidato-tab" data-bs-toggle="tab" 
                                        data-bs-target="#candidato" type="button" role="tab" 
                                        aria-controls="candidato" aria-selected="true">
                                    <i class="bi bi-person me-1"></i>Sou Candidato
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <!-- Aba para cadastro de empresa -->
                                <button class="nav-link" id="empresa-tab" data-bs-toggle="tab" 
                                        data-bs-target="#empresa" type="button" role="tab" 
                                        aria-controls="empresa" aria-selected="false">
                                    <i class="bi bi-building me-1"></i>Sou Empresa
                                </button>
                            </li>
                        </ul>

                        <!-- Conteúdo das abas -->
                        <div class="tab-content" id="myTabContent">
                            <!-- Aba Candidato -->
                            <div class="tab-pane fade show active" id="candidato" role="tabpanel" 
                                 aria-labelledby="candidato-tab">
                                <!-- Formulário de cadastro para candidato -->
                                <form th:action="@{/cadastro/candidato}" method="post" 
                                      onsubmit="return validarSenha()">
                                    <div class="mb-3">
                                        <label class="form-label">Nome completo</label>
                                        <input type="text" name="nome" class="form-control" 
                                               placeholder="Seu nome completo" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">E-mail</label>
                                        <input type="email" name="email" class="form-control" 
                                               placeholder="seu@email.com" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Telefone</label>
                                        <input type="text" name="telefone" class="form-control" 
                                               placeholder="(11) 99999-9999" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Senha</label>
                                        <!-- Campo de senha com validação JavaScript -->
                                        <input type="password" name="senha" id="senhaCandidato" 
                                               class="form-control" placeholder="Minimo 6 caracteres" required>
                                        <div class="form-text">A senha deve ter pelo menos 6 caracteres</div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Experiencia Profissional</label>
                                        <textarea name="experiencia" class="form-control" rows="3" 
                                                  placeholder="Descreva sua experiencia profissional..." 
                                                  required></textarea>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Curriculo/Formacao</label>
                                        <textarea name="curriculo" class="form-control" rows="3" 
                                                  placeholder="Descreva sua formacao academica, cursos, habilidades..." 
                                                  required></textarea>
                                        <div class="form-text">Este sera seu curriculo visivel para as empresas</div>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100 py-2">
                                        <i class="bi bi-person-plus"></i> Cadastrar como Candidato
                                    </button>
                                </form>
                            </div>

                            <!-- Aba Empresa -->
                            <div class="tab-pane fade" id="empresa" role="tabpanel" 
                                 aria-labelledby="empresa-tab">
                                <!-- Formulário de cadastro para empresa -->
                                <form th:action="@{/cadastro/empresa}" method="post" 
                                      onsubmit="return validarSenhaEmpresa()">
                                    <div class="mb-3">
                                        <label class="form-label">Razao Social</label>
                                        <input type="text" name="nome" class="form-control" 
                                               placeholder="Nome legal da empresa" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Nome Fantasia</label>
                                        <input type="text" name="nomeFantasia" class="form-control" 
                                               placeholder="Nome comercial" required>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">E-mail corporativo</label>
                                        <input type="email" name="email" class="form-control" 
                                               placeholder="empresa@email.com" required>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label">Senha</label>
                                        <!-- Campo de senha com validação JavaScript -->
                                        <input type="password" name="senha" id="senhaEmpresa" 
                                               class="form-control" placeholder="Minimo 6 caracteres" required>
                                        <div class="form-text">A senha deve ter pelo menos 6 caracteres</div>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 py-2">
                                        <i class="bi bi-building-add"></i> Cadastrar como Empresa
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Link para página de login -->
                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Ja tem uma conta? <a href="/login">Faca login aqui</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Importação do JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Validação de senha para candidato - verifica se tem pelo menos 6 caracteres
        function validarSenha() {
            const senha = document.getElementById('senhaCandidato').value;
            if (senha.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres');
                return false;
            }
            return true;
        }

        // Validação de senha para empresa - verifica se tem pelo menos 6 caracteres
        function validarSenhaEmpresa() {
            const senha = document.getElementById('senhaEmpresa').value;
            if (senha.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres');
                return false;
            }
            return true;
        }

        // Ativa aba baseada no parâmetro da URL (para quando vem de redirecionamento)
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const tipo = urlParams.get('tipo');
            if (tipo === 'empresa') {
                const empresaTab = new bootstrap.Tab(document.getElementById('empresa-tab'));
                empresaTab.show();
            }
        });
    </script>
</body>
</html>
