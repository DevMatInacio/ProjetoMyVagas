<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Candidatos</title>
<!-- Importação do Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Cabeçalho da página -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3">Candidatos</h1>
            <!-- Botão para voltar à página inicial -->
            <a href="/" class="btn btn-outline-secondary btn-sm">Voltar</a>
        </div>

        <!-- Seção de mensagens do sistema -->
        <div th:if="${msg != null}" class="alert alert-info" th:text="${msg}"></div>

        <!-- Tabela de candidatos cadastrados -->
        <div class="card shadow-sm mb-4">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-secondary">
                        <tr>
                            <th style="width: 70px">ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Senha</th>
                            <th>Currículo</th>
                            <th style="width: 160px" class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loop através da lista de candidatos -->
                        <tr th:each="cand : ${candidatos}">
                            <td th:text="${cand.id}">1</td>
                            <td th:text="${cand.nome}">João</td>
                            <td th:text="${cand.email}">joao@email.com</td>
                            <td>••••••</td> <!-- Senha oculta por segurança -->
                            <td th:text="${#strings.abbreviate(cand.curriculo, 30)}" 
                                th:title="${cand.curriculo}">Resumo rápido do currículo</td>
                            <!-- Botões de ação -->
                            <td class="text-center">
                                <a th:href="@{'/candidatos/editar/' + ${cand.id}}" 
                                   class="btn btn-sm btn-primary">Editar</a>
                                <a th:href="@{'/candidatos/deletar/' + ${cand.id}}" 
                                   class="btn btn-sm btn-danger ms-1">Excluir</a>
                            </td>
                        </tr>

                        <!-- Mensagem quando não há candidatos -->
                        <tr th:if="${#lists.isEmpty(candidatos)}">
                            <td colspan="6" class="text-center py-4">
                                Nenhum candidato encontrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Formulário para cadastrar novo candidato -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Cadastrar novo candidato</h2>
                <form th:action="@{/candidatos}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control" required />
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" required />
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Currículo</label>
                            <input type="text" name="curriculo" class="form-control" 
                                   placeholder="Breve descrição" />
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-success">Salvar candidato</button>
                            <button type="reset" class="btn btn-secondary ms-2">Limpar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
